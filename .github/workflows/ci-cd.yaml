name: CI/CD — OS Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: '21'

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — Build, testes e cobertura (JaCoCo)
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para SonarCloud

      - name: Configurar Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cache SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build e testes com cobertura
        run: ./gradlew check jacocoTestReport --no-daemon

      - name: Upload relatório JaCoCo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/
          retention-days: 7

      - name: SonarQube Cloud
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_PROJECT_KEY" ] || [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Configure SONAR_TOKEN como secret e SONAR_PROJECT_KEY/SONAR_ORGANIZATION como variables do repositório."
            exit 1
          fi

          ./gradlew sonar --no-daemon \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION"

  # ─────────────────────────────────────────────
  # JOB 2 — Docker build/push + deploy K8s
  #          Apenas na branch main
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    environment:
      name: producao

    steps:
      - uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Obter Account ID
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Login ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Criar repositório ECR se necessário
        run: |
          aws ecr describe-repositories --repository-names oficina-os-service \
            --region $AWS_REGION > /dev/null 2>&1 || \
          aws ecr create-repository --repository-name oficina-os-service \
            --region $AWS_REGION

      - name: Build e push da imagem
        run: |
          IMAGE=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/oficina-os-service
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest .
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest
          echo "IMAGE_URI=$IMAGE:$GITHUB_SHA" >> $GITHUB_ENV

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Configurar kubeconfig (EKS)
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name app-cluster-producao

      - name: Criar/atualizar Secret K8s
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          kubectl delete secret os-service-secrets -n oficina-mvp-prod --ignore-not-found=true
          kubectl create secret generic os-service-secrets \
            --namespace=oficina-mvp-prod \
            --from-literal=DB_PASSWORD="${{ secrets.OS_DB_PASSWORD }}" \
            --from-literal=MONGO_URI="$MONGO_URI" \
            --from-literal=RABBIT_HOST="${{ secrets.RABBIT_HOST }}" \
            --from-literal=RABBIT_USER="${{ secrets.RABBIT_USER }}" \
            --from-literal=RABBIT_PASS="${{ secrets.RABBIT_PASS }}" \
            --from-literal=RABBIT_VHOST="${{ secrets.RABBIT_VHOST }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap
        run: kubectl apply -f k8s/producao/configmap.yaml

      - name: Aplicar Service
        run: kubectl apply -f k8s/base/service.yaml

      - name: Aplicar Deployment
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE_URI|g" k8s/base/deployment.yaml \
            | kubectl apply -f -

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/os-service \
            -n oficina-mvp-prod --timeout=300s

      - name: Resumo do deploy
        run: |
          echo "## ✅ OS Service deployado" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Imagem | $IMAGE_URI |" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | oficina-mvp-prod |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $GITHUB_SHA |" >> $GITHUB_STEP_SUMMARY
