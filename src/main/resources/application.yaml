spring:
  application:
    name: oficina-os-service

  # Configuração PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5433/oficina_os_db
    username: postgres
    password: 12345os
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  # Conexão com o MongoDB
  data:
    mongodb:
      uri: mongodb://admin:12345mongo@localhost:27017/os_history?authSource=admin

  # RabbitMQ (local)
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASS:guest}
    virtual-host: ${RABBIT_VHOST:/}
    ssl:
      enabled: ${RABBIT_SSL_ENABLED:false}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2000ms
          multiplier: 2.0
          max-interval: 10000ms
        default-requeue-rejected: false

# URLs dos outros microsserviços (substituídas em cada profile)
services:
  billing:
    url: ${BILLING_SERVICE_URL:http://localhost:8081}
  execution:
    url: ${EXECUTION_SERVICE_URL:http://localhost:8082}

# Probes de saúde e métricas para Kubernetes e Prometheus
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  health:
    probes:
      enabled: true
