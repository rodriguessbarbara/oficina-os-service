spring:
  datasource:
    url: jdbc:h2:mem:oficina_os_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    mongodb:
      uri: mongodb://localhost:27017/os_test_db

  rabbitmq:
    host: localhost
    port: 5672

services:
  billing:
    url: http://localhost:8081
  execution:
    url: http://localhost:8082
